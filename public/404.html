<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Nisshy</title>
    <!--
      GitHub Pages 用 SPA リダイレクト (rafgraph/spa-github-pages)
      存在しないパス(/ff14 など)へ直接アクセスされた際、index.html へ
      クエリ付きで転送し、index.html 側の script が元のパスへ復元する。
      ユーザーサイト(username.github.io)はルート公開なので 0 を指定。
    -->
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
